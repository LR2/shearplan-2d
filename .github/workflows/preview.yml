name: Validate review preview

on:
  push:
    branches: [codex-review]

permissions:
  contents: read

concurrency:
  group: review-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build
        env:
          VITE_STORAGE_NAMESPACE: 'shearplan:codex-review:'
